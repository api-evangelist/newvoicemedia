regions:
  style: regional-subdomain
  base_url: https://{region}.api.cc.vonage.com
  documented_regions: [emea]
  note: Requests must be sent to the regional API gateway that hosts the tenant.
webhooks:
  supported: true
  model: subscription
  signature_header: Vonage-Signature
  delivery: HTTPS POST to a subscriber-provided fully-qualified https URL
  ref: asyncapi/newvoicemedia-webhooks.yml
error_envelope:
  media_type: application/json
  note: >-
    Individual VCC API reference pages document per-endpoint HTTP status codes
    and JSON error bodies; a unified RFC 9457 problem+json envelope is not
    advertised across the suite.
idempotency:
  supported: unknown
  note: No provider-wide idempotency-key contract is documented in the VCC API reference.
