notes: >-
  Cross-cutting request/response semantics for the Vonage Contact Center (VCC,
  formerly NewVoiceMedia) API suite, captured from the VCCA documentation.
authentication:
  style: oauth2-client-credentials
  header: 'Authorization: Bearer {access_token}'
  token_endpoint: https://{region}.cc.vonage.com/Auth/connect/token
