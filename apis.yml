image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/newvoicemedia.png
name: NewVoiceMedia
description: >-
  NewVoiceMedia is a cloud contact-center (CCaaS) platform founded in the UK and
  acquired by Vonage in 2018, now delivered as Vonage Contact Center (VCC). Its
  developer program, still published under the newvoicemedia.com domain and the
  VCC documentation, exposes a suite of REST APIs for managing customer
  interactions, agent presence and availability, conversation analytics, call
  and interaction content (recordings and transcripts), insights and reporting
  stats, PCI-compliant payments, media channels, user administration, and event
  webhooks. All APIs authenticate with OAuth 2.0 client-credentials, returning a
  short-lived Bearer token, and are served from regional API gateways at
  https://{region}.api.cc.vonage.com.
